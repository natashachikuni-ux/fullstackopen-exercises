services:
  backend:
    build: ./example-backend
    ports:
      - "8080:8080"
    container_name: compose-backend
    environment:
      - REQUEST_ORIGIN=http://localhost # 👈 Updated to standard port 80 for the proxy
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./example-backend:/usr/src/app

  frontend:
    build:
      context: ./example-frontend
      args:
        - REACT_APP_BACKEND_URL=http://localhost/api # 👈 Updated so frontend sends requests through the proxy
    ports:
      - "5001:80"
    container_name: compose-frontend
    volumes:
      - ./example-frontend:/usr/src/app

  redis:
    image: redis:7-alpine
    container_name: compose-redis

  postgres:
    image: postgres:15-alpine
    container_name: compose-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - database_data:/var/lib/postgresql/data

  # 👇 ADDING THE MISSING GATEWAY PIECE HERE
  nginx:
    image: nginx:1.25-alpine
    container_name: compose-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  database_data: